name: AI Code Review

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get PR diff
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} \
            > pr.diff

      - name: Run tests
        id: tests
        run: |
          CHANGED_PACKAGES=$(grep "^+++ b/" pr.diff | grep "src/main/.*\.java$" \
            | sed 's|.*src/main/java/||; s|/[^/]*\.java$||; s|/|.|g' \
            | sort -u)
          if [ -z "$CHANGED_PACKAGES" ]; then
            echo "No changed production classes found, skipping tests"
            exit 0
          fi
          TEST_NAMES=$(echo "$CHANGED_PACKAGES" | sed 's/$/*Test/' | tr '\n' ',' | sed 's/,$//')
          echo "Running tests: $TEST_NAMES"
          mvn test -Dtest="$TEST_NAMES" -Dsurefire.failIfNoSpecifiedTests=false -B
        continue-on-error: true

      - name: Send PR report
        run: |
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            PASSED=true
            FAILED_TESTS="[]"
          else
            PASSED=false
            FAILED_TESTS=$(
              find target/surefire-reports -name "TEST-*.xml" 2>/dev/null | xargs -I{} python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('{}')
          for tc in tree.getroot().iter('testcase'):
              failure = tc.find('failure')
              error = tc.find('error')
              node = failure if failure is not None else error
              if node is not None:
                  msg = (node.get('message') or '').split(' ==>')[0].strip()
                  print(msg if msg else tc.get('classname') + '.' + tc.get('name'))
          " 2>/dev/null | jq -R . | jq -s .
            )
          fi
          DIFF=$(cat pr.diff)
          PAYLOAD=$(jq -n \
            --arg github_username "${{ github.event.pull_request.user.login }}" \
            --arg pr_url "${{ github.event.pull_request.html_url }}" \
            --argjson passed "$PASSED" \
            --argjson failed_tests "$FAILED_TESTS" \
            --arg diff "$DIFF" \
            '{github_username: $github_username, pr_url: $pr_url, passed: $passed, failed_tests: $failed_tests, diff: $diff}')
          curl -s -X POST "${{ secrets.APP_BASE_URL }}/api/pr/report" \
            -H "Content-Type: application/json" \
            -H "X-Secret-Token: ${{ secrets.CI_PR_WEBHOOK_TOKEN }}" \
            -d "$PAYLOAD"
