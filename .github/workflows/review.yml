name: AI Code Review

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR diff
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} \
            > pr.diff

      - name: Send to review service
        run: |
          DIFF=$(cat pr.diff)
          PAYLOAD=$(jq -n \
            --arg github_username "${{ github.event.pull_request.user.login }}" \
            --arg pr_url "${{ github.event.pull_request.html_url }}" \
            --arg diff "$DIFF" \
            '{github_username: $github_username, pr_url: $pr_url, diff: $diff}')
          curl -s -X POST "${{ secrets.APP_BASE_URL }}/api/pr-review" \
            -H "Content-Type: application/json" \
            -H "X-Secret-Token: ${{ secrets.REVIEW_SECRET_TOKEN }}" \
            -d "$PAYLOAD"
